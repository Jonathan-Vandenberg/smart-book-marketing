# marketing.smartbookplanner.com — proxy to smart-book-marketing on :3001
# Add to server: sudo cp nginx-marketing.conf /etc/nginx/sites-available/marketing-smartbookplanner
#               sudo ln -sf /etc/nginx/sites-available/marketing-smartbookplanner /etc/nginx/sites-enabled/
# DNS: marketing.smartbookplanner.com A → 209.97.163.64 (same as apex)
# SSL: sudo certbot --nginx -d marketing.smartbookplanner.com
#      (or expand existing cert: sudo certbot certonly --nginx -d smartbookplanner.com -d www.smartbookplanner.com -d marketing.smartbookplanner.com)
# Test: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marketing.smartbookplanner.com;

    ssl_certificate /etc/letsencrypt/live/smartbookplanner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartbookplanner.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Dashboard is internal — discourage indexing
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 10m;

    location /api/admin/blog/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name marketing.smartbookplanner.com;
    return 301 https://$host$request_uri;
}
