name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy
          cp -r .next deploy/
          cp -r config deploy/
          cp -r node_modules deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          cp next.config.ts deploy/
          cp ecosystem.config.js deploy/
          mkdir -p deploy/data
          touch deploy/data/.gitkeep
          chmod -R 755 deploy

      - name: Upload to DigitalOcean
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          source: "./deploy/*"
          target: "/var/www/smart-book-marketing"
          strip_components: 1
          overwrite: true

      - name: Start application
        uses: appleboy/ssh-action@v1.0.3
        env:
          MARKETING_GA_SERVICE_ACCOUNT_JSON: ${{ secrets.MARKETING_GA_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          envs: MARKETING_GA_SERVICE_ACCOUNT_JSON
          script: |
            cd /var/www/smart-book-marketing

            if [ -n "$MARKETING_GA_SERVICE_ACCOUNT_JSON" ]; then
              printf '%s' "$MARKETING_GA_SERVICE_ACCOUNT_JSON" > service-account-key.json
              chmod 600 service-account-key.json
            fi

            cat > .env << ENVEOF
            NODE_ENV=production
            PORT=3001
            AGENTS_ENABLED=true
            DASHBOARD_SECRET=${{ secrets.MARKETING_DASHBOARD_SECRET }}
            ALLOWED_ADMIN_EMAILS=urbangentryjon@gmail.com
            AUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=https://marketing.smartbookplanner.com
            AUTH_URL=https://marketing.smartbookplanner.com
            AUTH_TRUST_HOST=true
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            PRODUCT_URL=https://smartbookplanner.com
            PRODUCT_NAME=Smart Book Planner
            PRODUCT_API_URL=https://smartbookplanner.com
            PRODUCT_ADMIN_SECRET=${{ secrets.ADMIN_API_SECRET }}
            OPENROUTER_API_KEY=${{ secrets.MARKETING_OPENROUTER_API_KEY }}
            GA4_PROPERTY_ID=${{ secrets.MARKETING_GA4_PROPERTY_ID }}
            GOOGLE_SERVICE_ACCOUNT_KEY_PATH=./service-account-key.json
            GSC_SITE_URL=https://www.smartbookplanner.com
            SIGNAL_CRON=0 6 * * 1
            CONTENT_CRON=0 7 * * 1
            ANALYTICS_CRON=0 6 * * 5
            DAILY_TIP_CRON=0 12 * * *
            PUBLISH_CRON=0 8 * * *
            BUFFER_ACCESS_TOKEN=${{ secrets.MARKETING_BUFFER_ACCESS_TOKEN }}
            BUFFER_ORGANIZATION_ID=6a7956b2db79c7bd2918feee
            BUFFER_CHANNEL_IDS=6a7967ffb2d9d577434c0aba
            GHOST_URL=https://blog.smartbookplanner.com
            GHOST_ADMIN_API_KEY=${{ secrets.MARKETING_GHOST_ADMIN_API_KEY }}
            GHOST_WEBHOOK_SECRET=${{ secrets.MARKETING_GHOST_WEBHOOK_SECRET }}
            ENVEOF

            fuser -k 3001/tcp || true
            sleep 1

            pm2 stop smart-book-marketing || true
            pm2 delete smart-book-marketing || true
            pm2 start ecosystem.config.js
            pm2 save

            pm2 list
