# blog.smartbookplanner.com — proxy to Ghost on :2368
#
# Install:
#   sudo cp nginx-ghost.conf /etc/nginx/sites-available/blog-smartbookplanner
#   sudo ln -sf /etc/nginx/sites-available/blog-smartbookplanner /etc/nginx/sites-enabled/
# DNS: blog.smartbookplanner.com A → 209.97.163.64
# SSL: sudo certbot --nginx -d blog.smartbookplanner.com
#       (or expand cert: certbot certonly --nginx -d smartbookplanner.com -d www.smartbookplanner.com -d marketing.smartbookplanner.com -d blog.smartbookplanner.com)
# Test: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.smartbookplanner.com;

    ssl_certificate /etc/letsencrypt/live/smartbookplanner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartbookplanner.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:2368;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.smartbookplanner.com;
    return 301 https://$host$request_uri;
}
